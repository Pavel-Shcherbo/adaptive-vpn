  - /opt/adaptive-vpn/venv/bin/pip install liboqs-python
  
  # Start the services
  - systemctl enable vpn-server
  - systemctl start vpn-server
  
  # Start StrongSwan
  - systemctl enable strongswan
  - systemctl start strongswan
  
  # Write setup completion message
  - echo "Adaptive VPN Server setup complete!" > /etc/motd 